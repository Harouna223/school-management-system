# ============================================================
# Sahel Edu - Orchestration Docker
# Usage : docker compose -f docker/docker-compose.yml up -d --build
# ============================================================

name: school-management

services:
  mysql:
    image: mysql:8.4
    container_name: school-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-school_management}
      # Utilisateur applicatif, créé UNIQUEMENT au premier démarrage (volume
      # vide) et doté des droits sur cette seule base. Le backend ne se connecte
      # plus en root : une injection SQL ou une image compromise ne peut plus
      # toucher les autres bases ni la table mysql.user.
      # Sur une installation existante le volume est déjà initialisé, donc ces
      # variables sont ignorées : c'est deploy/update.sh qui crée l'utilisateur.
      MYSQL_USER: ${DB_APP_USER:-}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # ⚠️ Écoute UNIQUEMENT sur la boucle locale de l'hôte : la base ne doit
      # jamais être joignable depuis le réseau de l'établissement ni Internet.
      # Pour une inspection locale : mysql -h 127.0.0.1 -P ${DB_PORT:-3306}.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      # Le schéma n'est PAS créé ici : Flyway en est la source de vérité unique
      # (backend-springboot/src/main/resources/db/migration) et crée l'intégralité
      # des tables au démarrage du backend. Monter en plus un script
      # d'initialisation faisait diverger deux schémas concurrents (tables
      # manquantes, noms de tables erronés), ce qui rendait toute installation
      # neuve impossible.
      - mysql_data:/var/lib/mysql
    healthcheck:
      # `mysqladmin ping` sort en 0 dès que le serveur RÉPOND, même si
      # l'authentification échoue : « Access denied » prouve justement que le
      # serveur tourne. Le mot de passe root était donc inutile ici — et il
      # finissait en clair dans `docker inspect`, donc dans la configuration du
      # healthcheck. Vérifié sur mysql 8.4 : sans -p, la commande sort en 0.
      #
      # 127.0.0.1 et non « localhost » : pendant l'initialisation du volume,
      # l'entrypoint démarre un serveur temporaire en --skip-networking, qui
      # n'écoute que sur la socket. Un ping par socket répondait donc « sain »
      # alors que le vrai serveur n'était pas encore là, et le backend pouvait
      # démarrer sur une base indisponible en TCP.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    # InnoDB doit vider ses journaux à l'arrêt : 10 s (valeur par défaut de
    # Docker) suffisent mal sur une base de plusieurs Go, et un SIGKILL laisse
    # une récupération au démarrage suivant.
    stop_grace_period: 60s
    # ---- Limites ----
    # Volontairement SANS cap_drop ni no-new-privileges : l'entree de l'image
    # MySQL demarre en root puis abandonne ses privileges vers l'utilisateur
    # `mysql` (CAP_SETUID/CAP_SETGID), et l'initialisation du volume ecrit des
    # fichiers appartenant a cet utilisateur. Retirer ces capacites casserait
    # le demarrage sur un volume neuf. Le conteneur n'expose aucun port public
    # (127.0.0.1 uniquement), la surface reste donc faible.
    #
    # Le plafond protege l'hote d'une requete pathologique ou d'un buffer pool
    # mal dimensionne : sans lui, le noyau tue des processus au hasard.
    mem_limit: 1g
    cpus: "1.5"
    pids_limit: 400
    # no-new-privileges, contrairement à cap_drop, est sans danger ici : il
    # empêche un execve d'ACQUÉRIR des privilèges (binaire setuid, capacité de
    # fichier), alors que l'entrypoint ne fait que les RÉDUIRE (gosu passe de
    # root à mysql). Vérifié sur mysql 8.4 : volume initialisé complètement,
    # requête servie, et /var/lib/mysql appartient bien à mysql:mysql — la
    # réduction de privilèges a donc bien eu lieu.
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: school-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-school_management}
      # Repli sur root tant que DB_APP_USER n'est pas défini : les installations
      # antérieures à l'introduction de l'utilisateur dédié continuent de démarrer
      # sans intervention. deploy/update.sh bascule ensuite sur le compte applicatif.
      DB_USERNAME: ${DB_APP_USER:-root}
      DB_PASSWORD: ${DB_APP_PASSWORD:-${DB_PASSWORD:-root}}
      # ⚠️ Aucune valeur par défaut : le secret de signature des jetons n'est plus
      # stocké dans le dépôt. Il doit être défini dans docker/.env (non versionné).
      # Générer : openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:-}
      # true en PRODUCTION (défaut) : le backend REFUSE de démarrer si le secret
      # est absent, vide, resté celui du dépôt, ou plus court que 32 octets décodés.
      REQUIRE_SECURE_SECRETS: ${REQUIRE_SECURE_SECRETS:-true}
      SERVER_PORT: 8080
      OPEN_IN_VIEW: ${OPEN_IN_VIEW:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: /app/uploads
      # Module « Cours et ressources » : limites et durée de vie des jetons.
      COURSE_MAX_VIDEO_MB: ${COURSE_MAX_VIDEO_MB:-500}
      COURSE_MAX_PDF_MB: ${COURSE_MAX_PDF_MB:-25}
      COURSE_TOKEN_TTL_MINUTES: ${COURSE_TOKEN_TTL_MINUTES:-120}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-512MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-512MB}
      SCHOOL_NAME: ${SCHOOL_NAME:-École Moderne de Technologie}
      # Aucune valeur par défaut : au premier démarrage, un ADMIN_PASSWORD vide ou
      # égal à « Admin@123 » fait échouer le backend (REQUIRE_SECURE_SECRETS=true).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Documentation interactive : à passer à false en production.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      WA_ENABLED: ${WA_ENABLED:-false}
      WA_PROVIDER: ${WA_PROVIDER:-meta}
      WA_META_TOKEN: ${WA_META_TOKEN:-}
      WA_META_PHONE_ID: ${WA_META_PHONE_ID:-}
      WA_TWILIO_SID: ${WA_TWILIO_SID:-}
      WA_TWILIO_TOKEN: ${WA_TWILIO_TOKEN:-}
      WA_TWILIO_FROM: ${WA_TWILIO_FROM:-}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_TWILIO_SID: ${SMS_TWILIO_SID:-}
      SMS_TWILIO_TOKEN: ${SMS_TWILIO_TOKEN:-}
      SMS_TWILIO_FROM: ${SMS_TWILIO_FROM:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      # ⚠️ Les fichiers pédagogiques vivent sur l'HÔTE, pas dans la couche du
      # conteneur : un redémarrage, une mise à jour ou une reconstruction
      # d'image ne perd rien. Le répertoire doit exister et appartenir à
      # l'utilisateur qui administre la pile (voir docs/COURS_VIDEO_PDF.md).
      - ${UPLOAD_HOST_DIR:-/srv/sahel-edu/uploads}:/app/uploads
    ports:
      # Le backend n'est joignable que depuis la boucle locale : le frontend
      # l'atteint par le réseau interne Docker (backend:8080) et nginx proxifie
      # /api. Ce port publié ne sert qu'au diagnostic local.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # ---- Durcissement ----
    # Plafond memoire : la JVM est lancee avec -XX:MaxRAMPercentage=75, donc
    # elle dimensionne son tas d'apres cette limite (2 Go -> ~1,5 Go de tas).
    # Sans mem_limit, une fuite memoire fait tomber l'HOTE, pas le conteneur.
    #
    # cap_drop ALL : une JVM n'a besoin d'aucune capacite noyau particuliere.
    # Le conteneur tourne deja en UID 10001 (voir Dockerfile.backend), les deux
    # mesures se completent.
    mem_limit: 2g
    cpus: "1.5"
    pids_limit: 600
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Spring Boot ferme son pool de connexions et termine les requetes en cours
    # à l'arrêt. 10 s (défaut Docker) coupent parfois une transaction en cours.
    stop_grace_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: school-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # FRONTEND_BIND=127.0.0.1 quand un nginx hôte termine le TLS
      # (deploy/https.sh) ; 0.0.0.0 pour un accès direct en HTTP sur le LAN.
      # Cote conteneur le port est 8080, pas 80 : l'image nginx-unprivileged
      # n'a pas le droit de se lier a un port privilegie. Le port publie sur
      # l'hote (FRONTEND_PORT, 80 ou 8081) ne change donc pas, et nginx hote
      # continue de proxifier vers 127.0.0.1:8081.
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:8080"
    # ---- Durcissement ----
    # nginx ne sert que des fichiers statiques : aucune capacite noyau ne lui
    # est utile, et il n'a pas besoin d'ecrire dans son systeme de fichiers.
    # Les seuls chemins temporaires necessaires sont montes en tmpfs, donc en
    # memoire et effaces a l'arret du conteneur.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------
  # Il n'y a PAS de conteneur de sauvegarde, et c'est volontaire.
  #
  # Un service `db-backup` existait ici : boucle de 24 h, mysqldump + tar vers
  # le volume `backup_data`. Il a ete retire pour quatre raisons, toutes
  # verifiables dans son ancien code :
  #
  #   1. il ecrivait dans un volume Docker, donc SUR LE MEME DISQUE que les
  #      donnees : il ne protegeait ni d'une panne du disque, ni d'un
  #      ransomware, ni d'un vol de la machine ;
  #   2. il ne verifiait rien : ni l'integrite de l'archive, ni la presence de
  #      tables dans le dump. Une sauvegarde vide etait indiscernable d'une
  #      bonne ;
  #   3. il avalait ses erreurs (`|| echo ECHEC` renvoie 0). Un dump qui
  #      echouait chaque nuit depuis six mois ne produisait aucune alerte :
  #      `docker ps` affichait un conteneur « Up », et le probleme n'apparaissait
  #      qu'au moment de la restauration ;
  #   4. il codait en dur `school_management` au lieu de ${DB_NAME} : renommer
  #      la base suffisait a rendre la sauvegarde silencieusement inutile.
  #
  # La sauvegarde vit desormais a un seul endroit : deploy/backup.sh, installe
  # dans /usr/local/sbin/sahel-edu-backup et declenche par
  # sahel-edu-backup.timer. Il verifie la compression, exige la presence de
  # tables, compare octet par octet la copie hors site et ECHOUE si OFFSITE_DIR
  # est absent. Deux mecanismes de sauvegarde dont un seul est fiable, c'est
  # pire qu'un seul : le second donne une fausse assurance.
  # ------------------------------------------------------------------

volumes:
  mysql_data:
  # Conservé pour ne pas perdre les fichiers des installations antérieures :
  # le backend n'écrit plus dans ce volume mais dans ${UPLOAD_HOST_DIR}.
  uploads_data:
  # `backup_data` n'est plus déclaré : plus aucun service ne l'utilise. Le
  # volume existant n'est PAS supprimé (compose ne supprime jamais un volume
  # nommé), il reste consultable avec :
  #   docker run --rm -v school-management_backup_data:/b alpine ls -l /b
  # Il contient les anciennes sauvegardes locales du conteneur db-backup ;
  # vérifiez qu'elles sont bien reprises ailleurs avant de le retirer.

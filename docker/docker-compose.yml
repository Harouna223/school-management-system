# ============================================================
# Sahel Edu - Orchestration Docker
# Usage : docker compose -f docker/docker-compose.yml up -d --build
# ============================================================

name: school-management

services:
  mysql:
    image: mysql:8.4
    container_name: school-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-school_management}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # ⚠️ Écoute UNIQUEMENT sur la boucle locale de l'hôte : la base ne doit
      # jamais être joignable depuis le réseau de l'établissement ni Internet.
      # Pour une inspection locale : mysql -h 127.0.0.1 -P ${DB_PORT:-3306}.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: school-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-school_management}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1pbi1wcm9kdWN0aW9uLXdpdGgtYTM3LWNyYXdhbGxlbg==}
      REQUIRE_SECURE_SECRETS: ${REQUIRE_SECURE_SECRETS:-false}
      SERVER_PORT: 8080
      OPEN_IN_VIEW: ${OPEN_IN_VIEW:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: /app/uploads
      # Module « Cours et ressources » : limites et durée de vie des jetons.
      COURSE_MAX_VIDEO_MB: ${COURSE_MAX_VIDEO_MB:-500}
      COURSE_MAX_PDF_MB: ${COURSE_MAX_PDF_MB:-25}
      COURSE_TOKEN_TTL_MINUTES: ${COURSE_TOKEN_TTL_MINUTES:-120}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-512MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-512MB}
      SCHOOL_NAME: ${SCHOOL_NAME:-École Moderne de Technologie}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      WA_ENABLED: ${WA_ENABLED:-false}
      WA_PROVIDER: ${WA_PROVIDER:-meta}
      WA_META_TOKEN: ${WA_META_TOKEN:-}
      WA_META_PHONE_ID: ${WA_META_PHONE_ID:-}
      WA_TWILIO_SID: ${WA_TWILIO_SID:-}
      WA_TWILIO_TOKEN: ${WA_TWILIO_TOKEN:-}
      WA_TWILIO_FROM: ${WA_TWILIO_FROM:-}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_TWILIO_SID: ${SMS_TWILIO_SID:-}
      SMS_TWILIO_TOKEN: ${SMS_TWILIO_TOKEN:-}
      SMS_TWILIO_FROM: ${SMS_TWILIO_FROM:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      # ⚠️ Les fichiers pédagogiques vivent sur l'HÔTE, pas dans la couche du
      # conteneur : un redémarrage, une mise à jour ou une reconstruction
      # d'image ne perd rien. Le répertoire doit exister et appartenir à
      # l'utilisateur qui administre la pile (voir docs/COURS_VIDEO_PDF.md).
      - ${UPLOAD_HOST_DIR:-/srv/sahel-edu/uploads}:/app/uploads
    ports:
      # Le backend n'est joignable que depuis la boucle locale : le frontend
      # l'atteint par le réseau interne Docker (backend:8080) et nginx proxifie
      # /api. Ce port publié ne sert qu'au diagnostic local.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: school-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

  # Sauvegarde automatique de la base (dump quotidien, rétention 14 jours)
  db-backup:
    image: mysql:8.4
    container_name: school-db-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - backup_data:/backups
      # Vidéos et PDF : archivés avec la base dans les mêmes sauvegardes.
      - ${UPLOAD_HOST_DIR:-/srv/sahel-edu/uploads}:/uploads:ro
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          mysqldump -h mysql -uroot -p"$$DB_PASSWORD" --single-transaction --routines --triggers school_management > /backups/backup-$$(date +%Y%m%d-%H%M).sql && echo "[backup] sauvegarde effectuée : backup-$$(date +%Y%m%d-%H%M).sql" || echo "[backup] ECHEC de la sauvegarde"
          tar czf /backups/uploads-$$(date +%Y%m%d-%H%M).tar.gz -C /uploads . && echo "[backup] fichiers pédagogiques archivés" || echo "[backup] ECHEC de l'archivage des fichiers"
          find /backups \( -name 'backup-*.sql' -o -name 'uploads-*.tar.gz' \) -mtime +14 -delete
          sleep 86400
        done

volumes:
  mysql_data:
  # Conservé pour ne pas perdre les fichiers des installations antérieures :
  # le backend n'écrit plus dans ce volume mais dans ${UPLOAD_HOST_DIR}.
  uploads_data:
  backup_data:
# Zone de limitation de debit des routes d'authentification.
# Doit etre declaree dans le contexte « http » : ce fichier est inclus depuis
# conf.d, donc le contexte est correct.
#
# 120 requetes/minute (2/s) par adresse IP, avec une reserve de 40 requetes
# instantanees. Ce seuil est volontairement GENEREUX : il ne vise pas le
# brute-force (le backend verrouille deja le compte cible et compte les echecs
# par IP), mais la saturation de Tomcat. Une classe entiere qui se connecte a
# 8h derriere une seule adresse publique doit passer ; un deluge, non.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=120r/m;

server {
    # 8080 et non 80 : l'image « nginx-unprivileged » ne peut pas se lier a un
    # port privilegie, puisqu'elle n'a pas de droits root. Le port publie sur
    # l'hote reste FRONTEND_PORT (80 ou 8081), defini dans docker-compose.yml.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Adresse REELLE du client.
    #
    # Derriere le nginx hote (mode HTTPS), toutes les requetes arrivent depuis
    # l'adresse de la passerelle Docker : sans cela, la limitation par IP
    # ci-dessous deviendrait une limitation GLOBALE (tout le monde dans le meme
    # seau), et le backend verrait une seule IP pour tous les utilisateurs.
    # Seules les plages Docker sont dignes de confiance : un client du reseau
    # local qui se connecte directement ne peut donc pas falsifier son adresse
    # en fabriquant un en-tete X-Forwarded-For.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Debit depasse -> 429 (et non le 503 par defaut, qui laisserait croire a
    # une panne du service).
    limit_req_status 429;
    limit_req_log_level warn;

    # Le frontend lit error.response.data.message : sans corps JSON, l'utilisateur
    # verrait une erreur generique alors que la cause est explicite.
    error_page 429 = @trop_de_requetes;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Headers de sécurité (D17) : anti-clickjacking, anti-MIME-sniffing,
    # contrôle du Referer, et une CSP de base. « data: » / « blob: » autorisés
    # pour les avatars chargés côté client par FileAvatar/FileImage.
    #
    # script-src SANS 'unsafe-inline' : Vite 5 émet un HTML ne contenant que des
    # modules externes (aucun <script> en ligne, vérifié sur dist/index.html).
    # Une injection HTML ne peut donc plus exécuter de script arbitraire.
    # 'unsafe-eval' reste absent : aucune dépendance n'y recourt.
    #
    # style-src CONSERVE 'unsafe-inline' : MUI/Emotion injecte ses feuilles de
    # style dans le document à l'exécution. Le retirer casserait tout le rendu ;
    # cela demande d'adopter un nonce côté serveur, hors de portée d'un nginx
    # servant des fichiers statiques.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # HSTS : à activer UNIQUEMENT derrière un front TLS (décommenter) :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Application SPA : fallback sur index.html (jamais mis en cache,
    # les bundles hashed eux sont immutables et cache 30 jours)
    location / {
        try_files $uri $uri/ /index.html;
        # `expires` émet Cache-Control sans add_header : les en-têtes de sécurité
        # du bloc server restent hérités (un add_header local les supprimerait).
        expires -1;
    }

    # Le conteneur backend est recréé à chaque déploiement et reçoit alors une
    # NOUVELLE adresse IP. Avec un « proxy_pass » à nom d'hôte fixe, nginx résout
    # « backend » une seule fois, au démarrage, puis conserve l'ancienne adresse :
    # toutes les routes /api (et /uploads) renvoyaient 502 après un redéploiement
    # du backend, jusqu'au redémarrage du frontend. Le resolver interne de Docker
    # (127.0.0.11) combiné à l'emploi d'une variable force une résolution à chaque
    # requête (mise en cache 10 s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Routes d'authentification : seules routes limitees en debit.
    #
    # La limitation porte sur ce prefixe et non sur /api/ entier : /api/ est
    # appele en permanence par l'interface, et un plafond global casserait
    # l'usage normal. Ces cinq routes (login, refresh, logout, register,
    # change-password) sont toutes en POST et aucune n'est appelee a chaque
    # affichage de page.
    #
    # Le bloc est declare avant /api/ pour la lecture, mais c'est la longueur
    # du prefixe qui decide : /api/auth/ l'emporte toujours sur /api/.
    location ^~ /api/auth/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ecrasement (et non ajout) : voir le commentaire de set_real_ip_from.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=auth_limit burst=40 nodelay;

        proxy_http_version 1.1;
    }

    # Proxy API Spring Boot
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ⚠️ $remote_addr et NON $proxy_add_x_forwarded_for : la seconde forme
        # AJOUTE l'adresse reelle a la valeur fournie par le client, et le
        # backend lit la PREMIERE valeur de l'en-tete. Un client pouvait donc
        # envoyer « X-Forwarded-For: 1.2.3.4 » et contourner la limitation par
        # IP du login. Ici l'en-tete est ecrase : sa seule valeur est l'adresse
        # vue par nginx, apres restauration par set_real_ip_from.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vidéos pédagogiques : le corps d'un téléversement peut être volumineux.
        # Doit rester >= aux limites du backend (MAX_FILE_SIZE / COURSE_MAX_VIDEO_MB).
        client_max_body_size 512m;
        client_body_timeout 300s;

        # Téléversement et lecture vidéo : pas de mise en tampon côté nginx
        # (sinon la réponse Range attend d'être entièrement reçue du backend).
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Le backend gère lui-même les requêtes Range et renvoie 206 :
        # ne jamais réécrire Content-Range/Content-Length.
        proxy_http_version 1.1;
    }

    # Fichiers téléversés (reçus, photos, justificatifs).
    # ^~ est indispensable : sans lui, la location REGEX « \.(js|css|png|…) »
    # ci-dessous est évaluée AVANT cette location simple et servait les photos
    # depuis le disque de nginx → 404 au lieu de proxy vers le backend protégé.
    location ^~ /uploads/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Fichiers statiques : cache long (ancré en fin de nom de fichier,
    # ne casse ni /api ni les sous-routes de la SPA)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Corps renvoye lorsque la limite de debit est atteinte.
    location @trop_de_requetes {
        default_type application/json;
        return 429 '{"success":false,"message":"Trop de tentatives en peu de temps. Patientez une minute avant de reessayer."}';
    }
}
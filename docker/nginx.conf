server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Headers de sécurité (D17) : anti-clickjacking, anti-MIME-sniffing,
    # contrôle du Referer, et une CSP de base. « data: » / « blob: » autorisés
    # pour les avatars chargés côté client par FileAvatar/FileImage.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # HSTS : à activer UNIQUEMENT derrière un front TLS (décommenter) :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Application SPA : fallback sur index.html (jamais mis en cache,
    # les bundles hashed eux sont immutables et cache 30 jours)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Proxy API Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Fichiers téléversés (reçus, photos, justificatifs).
    # ^~ est indispensable : sans lui, la location REGEX « \.(js|css|png|…) »
    # ci-dessous est évaluée AVANT cette location simple et servait les photos
    # depuis le disque de nginx → 404 au lieu de proxy vers le backend protégé.
    location ^~ /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fichiers statiques : cache long (ancré en fin de nom de fichier,
    # ne casse ni /api ni les sous-routes de la SPA)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
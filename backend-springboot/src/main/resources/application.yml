spring:
  application:
    name: school-management-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:school_management}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # PHASE 7 — Flyway est la source de verite du schema (db/migration).
      # Hibernate ne fait que VALIDER la coherence : aucun DDL automatique,
      # impossible pour une erreur d'entite de modifier/supprimer une colonne
      # contenant des donnees. Toute evolution passe par une migration Flyway.
      ddl-auto: validate
    show-sql: false
    # D10 — open-in-view (PHASE 7 : bascule a false effectuee).
    # La cible stricte est maintenant la valeur par defaut : les connexions sont
    # liberees en fin de transaction et les N+1 reels sont exposes. Les endpoints
    # qui echouaient en serialisation hors transaction sont couverts par des
    # @EntityGraph dans les repositories concernes.
    # Pilotage conservable via la variable OPEN_IN_VIEW.
    open-in-view: ${OPEN_IN_VIEW:false}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      # Limite globale portée au maximum utile (vidéos pédagogiques).
      # Les limites par nature de fichier restent appliquées par
      # CourseFileStorageService (app.courses.max-video-mb / max-pdf-mb) :
      # une photo reste refusée par sa liste blanche d'octets magiques.
      max-file-size: ${MAX_FILE_SIZE:512MB}
      max-request-size: ${MAX_REQUEST_SIZE:512MB}
  # PHASE 7 — Migrations de schema (Flyway).
  # Flyway est la SOURCE DE VERITE du schema ; Hibernate se contente de valider.
  # baseline-on-migrate : une base existante sans historique recoit un historique
  # SANS rejouer V1 (aucune creation de table sur une base deja en production).
  # Toute evolution future = un nouveau fichier Vn__description.sql.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Un envoi trop volumineux doit produire un 413 JSON lisible, pas une
    # connexion coupée : Tomcat doit absorber le corps restant avant de répondre.
    max-swallow-size: ${MAX_SWALLOW_SIZE:512MB}
  error:
    include-message: never

app:
  jwt:
    # Aucun secret par defaut : JWT_SECRET doit etre fourni (voir SecurityStartupWarning).
    secret: ${JWT_SECRET:}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  school:
    name: ${SCHOOL_NAME:École Moderne de Technologie}
    address: ${SCHOOL_ADDRESS:Douala, Cameroun}
    phone: ${SCHOOL_PHONE:+237 600 000 000}
    email: ${SCHOOL_EMAIL:contact@school.edu}
  whatsapp:
    enabled: ${WA_ENABLED:false}
    provider: ${WA_PROVIDER:meta}
    meta-token: ${WA_META_TOKEN:}
    meta-phone-id: ${WA_META_PHONE_ID:}
    twilio-sid: ${WA_TWILIO_SID:}
    twilio-token: ${WA_TWILIO_TOKEN:}
    twilio-from: ${WA_TWILIO_FROM:}
    default-country-code: ${WA_COUNTRY_CODE:237}
  sms:
    enabled: ${SMS_ENABLED:false}
    twilio-sid: ${SMS_TWILIO_SID:${WA_TWILIO_SID:}}
    twilio-token: ${SMS_TWILIO_TOKEN:${WA_TWILIO_TOKEN:}}
    twilio-from: ${SMS_TWILIO_FROM:}
  # Module « Cours et ressources » (vidéos + PDF).
  courses:
    max-video-mb: ${COURSE_MAX_VIDEO_MB:500}
    max-pdf-mb: ${COURSE_MAX_PDF_MB:25}
    stream-token-ttl-minutes: ${COURSE_TOKEN_TTL_MINUTES:120}
  admin:
    username: admin
    password: ${ADMIN_PASSWORD:}
  security:
    # D15 : true en production → le démarrage ÉCHOUE si le secret JWT est encore
    # le défaut ou trop court pour HS256 (au lieu d'une simple alerte).
    require-secure-secrets: ${REQUIRE_SECURE_SECRETS:true}

springdoc:
  # La documentation interactive expose toute la surface d'API : la desactiver
  # en production avec SWAGGER_ENABLED=false.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.school: INFO
    org.springframework.security: WARN

management:
  health:
    mail:
      enabled: false
    db:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      # D18 : les détails (état de la base, disque) ne sont exposés qu'aux
      # requêtes authentifiées ; l'endpoint reste accessible publiquement pour
      # les healthchecks (statut global uniquement).
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,diskSpace
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

name: SMS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20
  JAVA_VERSION: 21

jobs:
  backend:
    name: Backend – Build & Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: school_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('backend-springboot/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile backend
        run: mvn -B -DskipTests compile
        working-directory: backend-springboot

      - name: Run backend tests
        run: mvn -B test
        working-directory: backend-springboot
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/school_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          APP_JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1naXRodWItYWN0aW9ucy1taW5pbXVtLTM5LWJ5dGVz

  frontend:
    name: Frontend – Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend-react/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend-react/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend-react

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend-react

      - name: Build frontend
        run: npm run build
        working-directory: frontend-react

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-react/dist/
          retention-days: 7

  docker:
    name: Docker – Build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # Le contexte `secrets` n'est pas autorise dans un `if` (ni au niveau job, ni au niveau
      # etape) : on l'expose via `env`, qui lui est autorise dans un `if` d'etape.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        id: dockerhub
        # Sans secrets DOCKER_USERNAME/DOCKER_PASSWORD, on saute la publication au lieu de faire
        # echouer tout le pipeline. Renseigner les secrets reactive la publication automatiquement.
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend Docker image
        if: ${{ steps.dockerhub.outcome == 'success' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/school-management-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        if: ${{ steps.dockerhub.outcome == 'success' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/school-management-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
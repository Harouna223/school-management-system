name: Sahel Edu CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    # Un commit qui ne touche que de la documentation n'a rien a faire dans un
    # pipeline qui reconstruit deux images Docker : c'est ~3 minutes de calcul
    # pour zero code verifie, et autant d'occasions de tomber sur le 429 de
    # Maven Central (voir le job `docker`). Le 2026-11-02, un commit
    # exclusivement documentaire a fait echouer `main` pour cette seule raison.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

env:
  # Dockerfile.frontend construit avec node:26-alpine, mais la CI teste ici en
  # Node 20 : ce n'est PAS aligne, et c'est assume pour l'instant.
  #
  # Passer la CI en Node 26 a ete tente (PR #48) et echoue : jsdom 29, utilise
  # par l'environnement de test de vitest, ne fonctionne pas sous Node 26 --
  # `window.localStorage` reste indefini et tous les tests qui le lisent
  # tombent (`Cannot read properties of undefined (reading 'getItem')`).
  #
  # Attention, la mesure du 2026-11-02 corrige une intuition repandue : ce n'est
  # PAS la montee de version qui bloque. Avec vite 8.3.5 / vitest 5.0.5, `npm ci`,
  # le lint et les 14 suites de tests passent sous Node 20 ; les avertissements
  # EBADENGINE (vitest 5 exige ^22.12) ne sont pas bloquants. Le seul vrai
  # blocage etait `manualChunks`, que Rolldown (bundler de Vite 8) n'accepte que
  # sous forme de fonction -- corrige dans la PR #53.
  #
  # Reste donc a aligner les deux chemins (CI en Node 20, image en Node 26), ce
  # qui suppose de faire monter jsdom a la version 30 en meme temps. Suivi dans
  # docs/ANALYSE_ETAT_DES_LIEUX.md.
  NODE_VERSION: 20
  JAVA_VERSION: 21

jobs:
  backend:
    name: Backend – Build & Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        # Aligne la CI sur la version de production (docker/docker-compose.yml) :
        # une divergence 8.0 / 8.4 peut masquer des differences de comportement
        # SQL (collations, types, DDL).
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: school_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('backend-springboot/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile backend
        run: mvn -B -DskipTests compile
        working-directory: backend-springboot

      - name: Run backend tests
        run: mvn -B test
        working-directory: backend-springboot
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/school_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          APP_JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1naXRodWItYWN0aW9ucy1taW5pbXVtLTM5LWJ5dGVz

      # Tests d'intégration (*IT, PHASE 6) : spring-context complet sur un vrai
      # MySQL via Testcontainers. Docker étant standard sur les runners GitHub,
      # le conteneur est lancé automatiquement (aucun service à déclarer).
      - name: Run integration tests
        run: mvn -B verify -DskipUnitTests=true -Djacoco.skip=true
        working-directory: backend-springboot

      # Un test d'integration « ignore » (Assumptions.abort quand aucune base
      # n'est joignable) n'est PAS un test reussi : il masquerait notamment une
      # migration Flyway cassee, donc une installation neuve impossible. Les IT
      # tournent sur un MySQL 8.4 jetable (Testcontainers) et creent le schema
      # via Flyway : ils constituent la validation reelle de l'installation.
      - name: Verifier qu'aucun test d'integration n'a ete ignore
        working-directory: backend-springboot
        run: |
          if ! ls target/failsafe-reports/*.txt >/dev/null 2>&1; then
            echo "ERREUR : aucun rapport de test d'integration produit."
            exit 1
          fi
          if grep -hE 'Skipped: [1-9]' target/failsafe-reports/*.txt; then
            echo "ERREUR : des tests d'integration ont ete ignores (Skipped > 0)."
            exit 1
          fi
          # Une classe neutralisee par Assumptions.abort (base injoignable) peut
          # apparaitre avec « Tests run: 0 » plutot qu'un compteur d'ignores.
          if grep -hE 'Tests run: 0,' target/failsafe-reports/*.txt; then
            echo "ERREUR : une classe de tests d'integration n'a execute aucun test."
            exit 1
          fi
          if grep -qE '<skipped>[1-9]' target/failsafe-reports/failsafe-summary.xml 2>/dev/null; then
            echo "ERREUR : le rapport global signale des tests ignores."
            exit 1
          fi
          echo "Tests d'integration executes sans ignore (Skipped: 0)."

  frontend:
    name: Frontend – Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: frontend-react/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend-react/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend-react

      # Analyse statique : detecte notamment un composant ou un hook utilise sans
      # import, qui passe le build mais provoque un ecran blanc au rendu.
      - name: Run lint
        run: npm run lint
        working-directory: frontend-react

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend-react

      - name: Build frontend
        run: npm run build
        working-directory: frontend-react

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend-react/dist/
          retention-days: 7

  exploitation:
    name: Exploitation – Scripts & Compose
    runs-on: ubuntu-latest
    # Aucun `needs` : ce job ne compile rien et doit echouer en premier.
    #
    # Pourquoi il existe : jusqu'ici RIEN ne verifiait deploy/. install.sh,
    # update.sh, backup.sh et install-offline.sh ne s'executent que sur le
    # serveur de l'etablissement, jamais en CI. Une coquille y restait donc
    # invisible jusqu'a l'installation reelle, chez le client, sans aucun
    # moyen de la decouvrir avant.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # -x suit les `source` : sans cela les variables definies dans
      # deploy/common.sh (APP_UID, BACKUP_ENV_FILE...) passeraient pour non
      # definies et l'analyse serait aveugle precisement la ou elle sert.
      # -S warning ecarte le bruit de style mais garde les vraies erreurs :
      # expansion non protegee, variable non definie, commande mal citee.
      - name: shellcheck – scripts de deploiement
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          }
          shellcheck --version | head -2
          mapfile -t scripts < <(git ls-files '*.sh')
          echo "Analyse de ${#scripts[@]} scripts : ${scripts[*]}"
          shellcheck -x -S warning "${scripts[@]}"

      # Redondance assumee avec shellcheck : cette garde ne depend d'aucun
      # paquet installe, donc elle reste utile si l'installation de shellcheck
      # echoue sur une image de runner plus recente.
      - name: Syntaxe bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do bash -n "$f"; done < <(git ls-files '*.sh')
          echo "Syntaxe bash OK."

      # `docker compose config` n'a pas besoin du demon Docker : c'est une
      # resolution cote client, ce job reste donc rapide et sans service.
      #
      # .env.example est copie en docker/.env pour reproduire EXACTEMENT
      # l'invocation de production (deploy/common.sh lance
      # `docker compose -f docker/docker-compose.yml`, sans --env-file : compose
      # lit docker/.env). Sans ce fichier les variables seraient resolues a
      # vide, et l'on validerait une configuration que personne n'utilise.
      - name: docker compose config
        run: |
          set -euo pipefail
          cd docker
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          echo "docker compose config OK."

      # L'etape precedente ne suffit pas : une variable referencee mais absente
      # de .env.example est resolue a la chaine vide et compose sort avec le
      # code 0. Le conteneur demarrerait alors avec une valeur vide, sans que
      # rien ne le signale. Seules les variables SANS valeur par defaut sont
      # exigees : `${VAR:-defaut}` a une valeur de repli assumee.
      - name: Variables obligatoires documentees dans .env.example
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          compose = pathlib.Path("docker/docker-compose.yml").read_text(encoding="utf-8")
          exemple = pathlib.Path("docker/.env.example").read_text(encoding="utf-8")
          definies = {m.group(1) for m in re.finditer(r"^([A-Za-z_][A-Za-z0-9_]*)=", exemple, re.M)}

          obligatoires, avec_defaut = set(), set()
          for m in re.finditer(r"\$\{([A-Za-z_][A-Za-z0-9_]*)(:?[-?][^}]*)?\}", compose):
              nom, modificateur = m.group(1), m.group(2) or ""
              # `${VAR:?message}` est obligatoire malgre le modificateur.
              if not modificateur or modificateur.startswith(":?"):
                  obligatoires.add(nom)
              else:
                  avec_defaut.add(nom)

          manquantes = sorted(obligatoires - definies)
          print(f"{len(obligatoires)} obligatoires, {len(avec_defaut)} avec valeur par defaut")
          if manquantes:
              print("::error::Absentes de docker/.env.example : " + ", ".join(manquantes))
              sys.exit(1)
          print("Toutes les variables obligatoires sont documentees.")
          PY

  docker:
    name: Docker – Build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Ce job tourne AUSSI sur les pull requests. C'est la seule verification des
    # Dockerfile et des images de base : tant qu'il etait reserve aux pushs sur
    # main, une montee d'image (node, eclipse-temurin, maven) passait la CI en
    # etant simplement *sautee*, donc validee sans avoir jamais ete construite.
    # Seule la publication reste reservee a main.
    services:
      # Base reelle pour la fumigation ci-dessous. Sans elle le backend refuse
      # de demarrer, et Flyway ne peut pas appliquer les migrations : on ne
      # verifierait que la construction de l'image, pas son demarrage.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: school_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      # Le contexte `secrets` n'est pas autorise dans un `if` (ni au niveau job, ni au niveau
      # etape) : on l'expose via `env`, qui lui est autorise dans un `if` d'etape.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      # `secrets` EST autorise dans un `env` de job, d'ou cette variable
      # intermediaire : elle sert a la fois a publier, a charger l'image dans le
      # demon local, et a decider si la fumigation peut tourner.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKER_USERNAME != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        id: dockerhub
        # Publication uniquement depuis main, et seulement si les secrets existent.
        # Sur une pull request on ne se connecte pas : rien n'est pousse, et les
        # secrets ne sont de toute facon pas disponibles depuis un fork.
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Les deux images sont construites a chaque push ET a chaque pull request,
      # meme sans secrets : c'est la seule validation des Dockerfile en CI.
      # Seule la publication est conditionnee.
      #
      # `cache-to` est reserve aux pushs sur main : l'export du cache GHA exige
      # un jeton en ecriture, or une PR Dependabot (ou issue d'un fork) recoit un
      # jeton en LECTURE SEULE. L'export echouerait et casserait le build -- donc
      # exactement les PR qu'on veut verifier. `cache-from` reste actif partout.
      #
      # `load` charge l'image dans le demon local quand elle n'est pas publiee :
      # sans cela la fumigation n'aurait aucune image a demarrer. Le second tag
      # `smoke-*` est fixe, donc independant de la presence des secrets.
      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/school-management-backend:latest
            smoke-backend:latest
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/school-management-frontend:latest
            smoke-frontend:latest
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      # ----------------------------------------------------------------
      # Fumigation : les images doivent DEMARRER, pas seulement se
      # construire. Une montee d'image de base change le moteur d'execution
      # (eclipse-temurin 21-jre -> 24-jre) et un build reussi ne dit rien de
      # la compatibilite a l'execution : Hibernate, Flyway et le chargement
      # des classes ne sont exerces qu'au demarrage.
      # ----------------------------------------------------------------
      - name: Fumigation – le backend demarre et repond
        if: ${{ env.PUBLISH != 'true' }}
        run: |
          set -euo pipefail
          docker run -d --name smoke-backend --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_NAME=school_management \
            -e DB_USERNAME=root -e DB_PASSWORD=root \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e ADMIN_PASSWORD='Fumigation-Adm1n-2026' \
            -e REQUIRE_SECURE_SECRETS=true \
            -e SWAGGER_ENABLED=false \
            -e UPLOAD_DIR=/app/uploads \
            --tmpfs /app/uploads:rw,uid=10001,gid=10001,mode=0750 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 600 \
            smoke-backend:latest

          echo "Attente du demarrage (Flyway applique les migrations)..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/liveness >/tmp/health.json 2>/dev/null; then
              echo "Reponse apres ${i} x 3s : $(cat /tmp/health.json)"
              if grep -q '"status":"UP"' /tmp/health.json; then
                echo "Backend demarre et sain."
                exit 0
              fi
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke-backend 2>/dev/null)" != "true" ]; then
              echo "::error::Le conteneur s'est arrete avant de repondre."
              docker logs smoke-backend || true
              exit 1
            fi
            sleep 3
          done

          echo "::error::Le backend n'a pas repondu en 180 s."
          docker logs --tail 120 smoke-backend || true
          exit 1

      - name: Fumigation – le frontend sert la page
        if: ${{ env.PUBLISH != 'true' }}
        run: |
          set -euo pipefail
          # Options de durcissement REPETEES a l'identique de
          # docker/docker-compose.yml : ce n'est pas une redondance inutile.
          # La CI lance `docker run`, elle ne lit jamais le fichier compose.
          # Sans ces drapeaux, un `read_only` ou un `cap_drop` qui empeche
          # nginx de demarrer passerait la CI au vert et ne casserait qu'en
          # production, au moment du deploiement.
          docker run -d --name smoke-frontend -p 8081:8080 \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/cache/nginx \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            smoke-frontend:latest
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8081/ | grep -qi '<div id="root">'; then
              echo "Nginx sert l'application (${i} x 3s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Le frontend ne sert pas la page attendue."
          docker logs smoke-frontend || true
          exit 1

      # Garde de non-regression du durcissement : sans elle, un Dockerfile qui
      # perdrait son USER repasserait au vert partout ailleurs. Le build, les
      # tests et la fumigation precedent ne disent RIEN de l'identite du
      # processus, or c'est precisement la mesure de securite.
      - name: Fumigation – les conteneurs ne tournent pas en root
        if: ${{ always() && env.PUBLISH != 'true' }}
        run: |
          set -euo pipefail
          for c in smoke-backend smoke-frontend; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null)" != "true" ]; then
              echo "::error::$c ne tourne pas : impossible de verifier l'UID."
              exit 1
            fi
            uid="$(docker exec "$c" id -u)"
            echo "$c tourne en UID $uid"
            if [ "$uid" = "0" ]; then
              echo "::error::$c tourne en root : le Dockerfile a perdu son USER."
              exit 1
            fi
          done

      - name: Nettoyage des conteneurs de fumigation
        if: ${{ always() && env.PUBLISH != 'true' }}
        run: docker rm -f smoke-backend smoke-frontend 2>/dev/null || true
# ============================================================
# Sahel Edu - veille automatique des dependances
#
# Constat a l'origine de ce fichier : Spring Boot 3.2.5 (mai 2024) est reste en
# place jusqu'en novembre 2026, alors que sa branche n'etait plus maintenue et
# ne recevait donc plus de correctifs de securite. Rien ne signalait ce
# vieillissement. Dependabot ouvre une pull request des qu'une version sort, et
# la CI existante verifie automatiquement qu'elle ne casse rien.
#
# Regle de partage, tiree du premier passage reel du 2026-11-01 :
#
#   - MINEURES et PATCH : regroupees par domaine (`update-types` ci-dessous).
#     Ce sont elles qui se fusionnent sans debat des que la CI est verte, et
#     c'est ce flux-la qui manquait -- c'est son absence qui fait pourrir un
#     projet, pas celle des majeures.
#
#   - MAJEURES : hors des groupes `tests`, `react` et `tooling`, donc une PR
#     par majeure. Le premier passage a montre qu'une majeure n'est pas une
#     pull request mais une migration :
#       * Spring Boot 3.5.16 -> 4.1.2 : getAllValidationResults() supprime,
#         DaoAuthenticationProvider n'a plus de constructeur sans argument ;
#       * MUI 5.18 -> 9.5 : @mui/icons-material/MailOutline n'existe plus ;
#       * eslint 9 -> 10 : eslint-plugin-react 7.37.5 plafonne a ^9.7 ;
#       * OpenPDF 1.3 -> 3.0 : tous les paquets passent de com.lowagie.* a
#         com.github.librepdf.openpdf.* ;
#       * Tailwind 3.4 -> 4.3 : le plugin PostCSS a demenage.
#     Regroupees avec des mineures, ces montees arrivaient melangees dans une PR
#     illisible. Separees, chacune est un chantier identifiable.
#
#   - EXCEPTION : les groupes `spring`, `mui` et `eslint` gardent les majeures.
#     Leurs membres ne peuvent pas monter separement (springdoc 2.x ne connait
#     pas Spring Framework 7 ; @mui/icons-material 9 exige @mui/material 9 ;
#     @eslint/js 10 exige eslint 10). Les en sortir produirait deux PR dont
#     aucune ne compile seule.
#
#   - Une majeure ecartee est FERMEE avec son diagnostic en commentaire, et
#     reportee dans docs/ANALYSE_ETAT_DES_LIEUX.md §4.1. Dependabot ne
#     represente pas une version dont la PR a ete fermee : pas de bruit
#     recurrent.
#
#   NOTE : on n'utilise PAS `ignore: version-update:semver-major`. Le
#   referencement GitHub ne dit pas clairement si `ignore` s'applique aussi aux
#   mises a jour de SECURITE. Si c'etait le cas, une faille dans Spring Boot
#   3.5.x passerait inapercue -- exactement le probleme que ce fichier existe
#   pour resoudre.
# ============================================================
version: 2
updates:
  # --- Backend (Maven) -------------------------------------------------
  - package-ecosystem: maven
    directory: "/backend-springboot"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Dakar
    # Assez de place pour la PR groupee de routine ET pour les majeures en
    # attente d'arbitrage : une majeure bloquee ne doit pas affamer les
    # correctifs de securite.
    open-pull-requests-limit: 8
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - backend
    groups:
      # Spring Boot et springdoc DOIVENT avancer ensemble : springdoc 2.5 ne
      # connait pas Spring Framework 6.2. Deux PR separees donneraient une
      # branche qui compile mais dont la documentation OpenAPI ne se genere
      # plus -- exactement la rupture silencieuse constatee lors du passage
      # a Boot 3.5.
      #
      # PAS d'`update-types` ici, volontairement : les majeures doivent rester
      # liees. Avec `minor, patch`, Boot 4 et springdoc 3 sont sortis en deux
      # PR distinctes (#29 et #30), chacune impossible a fusionner seule. Une
      # migration se relit comme un tout.
      spring:
        patterns:
          - "org.springframework*"
          - "org.springdoc*"
      # Bibliotheques de test : independantes les unes des autres, donc
      # mineures et patch seulement.
      tests:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
          - "org.testcontainers*"
        update-types:
          - minor
          - patch

  # --- Frontend (npm) ---------------------------------------------------
  - package-ecosystem: npm
    directory: "/frontend-react"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Dakar
    open-pull-requests-limit: 8
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - frontend
    groups:
      # MUI et Emotion sont indissociables (styles injectes a l'execution), et
      # `@mui/icons-material` declare `@mui/material` en peer dependency : une
      # icone en 9 avec un material en 5 ne s'installe pas. Pas d'`update-types`
      # ici pour la meme raison que `spring` : les majeures restent liees, sinon
      # elles sortent en deux PR dont aucune ne peut etre fusionnee (#33, #34).
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      # react, react-dom et leurs types DOIVENT partager la meme majeure :
      # `@types/react-dom` 19 exige `@types/react` 19, et react-dom 19 exige
      # react 19. Le groupe precedent filtrait les majeures, si bien que
      # react-dom et @types/react-dom sont partis seuls en 19 (#39) et ont
      # echoue en ERESOLVE. Pas d'`update-types` ici.
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # react-router est independant du cœur React : il fonctionne avec React 18
      # comme avec React 19. Il reste donc en mineures/patch pour ne pas etre
      # bloque par une migration React.
      react-router:
        patterns:
          - "react-router-dom"
        update-types:
          - minor
          - patch
      # eslint et @eslint/js DOIVENT partager la meme majeure : `@eslint/js` 10
      # exige `eslint` ^10. Le motif `eslint*` ne capturait PAS le nom scope
      # `@eslint/js`, qui partait donc seul et cassait `npm install` en
      # ERESOLVE (constate sur la PR #24). Ce groupe n'a pas d'`update-types` :
      # les majeures y restent liees, ce qui est le seul moyen d'eviter une
      # demi-montee incoherente.
      eslint:
        patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "@eslint/*"
      # Chaine Vite : `@vitejs/plugin-react` declare `vite` en peer, et
      # `vitest` aussi. Montees separement, elles ne s'installent pas -- #47
      # (vite 8) est refuse par plugin-react 4.7, #45 (plugin-react 6) exige
      # vite 8, #43 (vitest 5) fait echouer la resolution. Les majeures restent
      # donc liees dans un groupe dedie.
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
      # Outillage independant : le risque est une CI cassee, pas un changement
      # de comportement applicatif.
      tooling:
        patterns:
          - "jsdom"
          - "@testing-library/*"
          - "tailwindcss"
          - "autoprefixer"
          - "postcss"
        update-types:
          - minor
          - patch

  # --- Images Docker des Dockerfiles -----------------------------------
  # Les images de base fixent la version d'execution (Java 21, Node 20) : une
  # montee majeure change le moteur d'execution de l'application, elle ne se
  # fusionne pas a l'aveugle. La CI construit desormais les images a chaque
  # pull request (job `docker`), mais le choix de version reste manuel.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Dakar
    open-pull-requests-limit: 4
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - docker

  # --- Actions utilisees par la CI -------------------------------------
  # Les actions GitHub sont du code execute avec les secrets du depot : les
  # laisser vieillir est un risque de chaine d'approvisionnement. Ici les
  # majeures sont acceptees telles quelles : une action cassee fait echouer la
  # CI, qui est precisement ce qu'on veut.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Dakar
    open-pull-requests-limit: 4
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
